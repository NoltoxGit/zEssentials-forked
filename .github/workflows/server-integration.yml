name: Server integration

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild the server JAR even when source branches have not changed
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: server-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'NoltoxGit/zEssentials-forked'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration/server
          fetch-depth: 0

      - name: Prepare the combined branch
        id: prepare
        env:
          INTEGRATION_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild && 'true' || 'false' }}
        run: python3 .github/server-integration/update.py

      - name: Set up the GroupeZ build environment
        if: steps.prepare.outputs.build == 'true'
        uses: GroupeZ-dev/actions/.github/actions/setup-build@v1.0.0
        with:
          java-version: '25'
          build-tool: gradle
          working-directory: ${{ steps.prepare.outputs.worktree }}

      - name: Build the server plugin
        if: steps.prepare.outputs.build == 'true'
        working-directory: ${{ steps.prepare.outputs.worktree }}
        run: bash ./gradlew :shadowJar -Darchive.classifier=server --console=plain

      - name: Upload the server plugin
        if: steps.prepare.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zEssentials-server
          path: ${{ steps.prepare.outputs.worktree }}/target/*-server.jar
          if-no-files-found: error
          retention-days: 7

      - name: Publish the validated branch
        if: steps.prepare.outputs.changed == 'true'
        env:
          INTEGRATION_COMMIT: ${{ steps.prepare.outputs.commit }}
        run: git push origin "$INTEGRATION_COMMIT:refs/heads/integration/server"
